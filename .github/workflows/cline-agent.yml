name: Cline Agent
run-name: Cline Agent • ${{ github.event_name }} • ${{ github.actor }}

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      task:
        description: Cline 작업 명령
        required: true
        type: string
  repository_dispatch:
    types: [cline-agent]

permissions:
  contents: write
  issues: write

concurrency:
  group: cline-agent
  cancel-in-progress: false

jobs:
  cline-agent:
    name: Cline Agent / execute task
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Agent start
        shell: powershell
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          MANUAL_TASK: ${{ inputs.task }}
          DISPATCH_TASK: ${{ github.event.client_payload.task }}
        run: |
          Write-Host '=== CLINE AGENT START ==='
          Write-Host "Event: $env:GITHUB_EVENT_NAME"
          Write-Host "Actor: $env:GITHUB_ACTOR"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          if ($env:GITHUB_EVENT_NAME -eq 'issues') {
            Write-Host "Issue: #${env:GITHUB_EVENT_ISSUE_NUMBER} - $env:ISSUE_TITLE"
          }

      - name: Build task from Issue / manual dispatch
        shell: powershell
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          MANUAL_TASK: ${{ inputs.task }}
          DISPATCH_TASK: ${{ github.event.client_payload.task }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'issues') {
            $task = "Issue #$env:GITHUB_EVENT_ISSUE_NUMBER`nTitle: $env:ISSUE_TITLE`n`n$env:ISSUE_BODY"
          } elseif ($env:MANUAL_TASK) {
            $task = $env:MANUAL_TASK
          } elseif ($env:DISPATCH_TASK) {
            $task = $env:DISPATCH_TASK
          } else {
            throw 'No Cline task was supplied.'
          }
          Set-Content -Path "$env:RUNNER_TEMP\cline-task.txt" -Value $task -Encoding UTF8
          Write-Host '=== TASK ==='
          Write-Host $task

      - name: Verify Cline CLI
        shell: powershell
        run: |
          cline --version
          if ($LASTEXITCODE -ne 0) { throw 'Cline CLI is not available on the self-hosted runner.' }

      - name: Run Cline
        shell: powershell
        env:
          CLINE_API_KEY: ${{ secrets.CLINE_API_KEY }}
        run: |
          Write-Host '=== CLINE EXECUTION ==='
          Write-Host 'Cline is now executing the requested task. Live agent events follow.'
          $task = Get-Content "$env:RUNNER_TEMP\cline-task.txt" -Raw
          cline --json --yolo --cwd "$env:GITHUB_WORKSPACE" $task
          if ($LASTEXITCODE -ne 0) { throw "Cline exited with code $LASTEXITCODE" }

      - name: Publish Cline changes
        shell: powershell
        run: |
          Write-Host '=== PUBLISH CHANGES ==='
          git status --short
          git config user.name 'Cline Agent'
          git config user.email 'cline-agent@users.noreply.github.com'
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No repository changes to commit.'
            exit 0
          }
          git commit -m "Cline Agent: execute requested task"
          git push origin HEAD:main

      - name: Agent finish
        shell: powershell
        run: |
          Write-Host '=== CLINE AGENT FINISH ==='
          Write-Host 'Task execution completed. Repository changes have been published.'
