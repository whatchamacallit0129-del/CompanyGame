name: Cline Issue Assistant

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write

jobs:
  respond:
    runs-on: ubuntu-latest
    steps:
      - name: Check for @cline mention
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment?.body || "";
            const isPR = !!context.payload.issue?.pull_request;
            const hit = body.toLowerCase().includes("@cline");
            core.setOutput("hit", (!isPR && hit) ? "true" : "false");
            core.setOutput("issue_number", String(context.payload.issue?.number || ""));
            core.setOutput("issue_url", context.payload.issue?.html_url || "");
            core.setOutput("comment_body", body);

      - name: Checkout repository
        if: steps.detect.outputs.hit == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.detect.outputs.hit == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Cline CLI
        if: steps.detect.outputs.hit == 'true'
        run: sudo npm install -g cline

      - name: Create Cline Instance
        if: steps.detect.outputs.hit == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLINE_DIR: ${{ runner.temp }}/cline
        run: |
          set -euo pipefail
          INSTANCE_OUTPUT=$(cline instance new 2>&1)
          echo "$INSTANCE_OUTPUT"
          CLINE_ADDRESS=$(echo "$INSTANCE_OUTPUT" | grep "Address:" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]+' | head -1)
          test -n "$CLINE_ADDRESS"
          echo "CLINE_ADDRESS=$CLINE_ADDRESS" >> "$GITHUB_ENV"
          cline config set open-router-api-key="$OPENROUTER_API_KEY" --address "$CLINE_ADDRESS" -v

      - name: Download official Cline issue script
        if: steps.detect.outputs.hit == 'true'
        run: |
          curl -L https://raw.githubusercontent.com/cline/cline/main/src/samples/cli/github-issue-rca/analyze-issue.sh -o analyze-issue.sh
          chmod +x analyze-issue.sh

      - name: Run Cline
        if: steps.detect.outputs.hit == 'true'
        id: analyze
        env:
          ISSUE_URL: ${{ steps.detect.outputs.issue_url }}
          COMMENT: ${{ steps.detect.outputs.comment_body }}
          CLINE_ADDRESS: ${{ env.CLINE_ADDRESS }}
        run: |
          set -euo pipefail
          RESULT=$(./analyze-issue.sh "${ISSUE_URL}" "The user asked: ${COMMENT}" "$CLINE_ADDRESS")
          {
            echo 'result<<EOF'
            printf "%s\n" "$RESULT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish Cline changes
        if: steps.detect.outputs.hit == 'true'
        run: |
          set -euo pipefail
          git config user.name "Cline Agent"
          git config user.email "cline-agent@users.noreply.github.com"
          git status --short
          git add -- ':!analyze-issue.sh'
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "Cline: execute issue task"
            git push origin HEAD:main
          fi

      - name: Post response
        if: steps.detect.outputs.hit == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.detect.outputs.issue_number }}
          RESULT: ${{ steps.analyze.outputs.result }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: process.env.RESULT || "(no output)"
            });
