name: Cline Issue Assistant

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  respond:
    # This runner must be the Windows PC that has Cline and the Unity project.
    runs-on: [self-hosted, windows]
    timeout-minutes: 60
    steps:
      - name: Check for authorized @cline mention
        id: detect
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.comment?.body || "";
            const isPR = !!context.payload.issue?.pull_request;
            const association = context.payload.comment?.author_association || "";
            const authorized = ["OWNER", "MEMBER", "COLLABORATOR"].includes(association);
            const hit = body.toLowerCase().includes("@cline");
            core.setOutput("hit", (!isPR && authorized && hit) ? "true" : "false");
            core.setOutput("issue_number", String(context.payload.issue?.number || ""));
            core.setOutput("issue_url", context.payload.issue?.html_url || "");
            core.setOutput("comment_body", body);

      - name: Checkout repository
        if: steps.detect.outputs.hit == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Cline CLI
        if: steps.detect.outputs.hit == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          cline --version

      - name: Run Cline on the local Windows/Unity machine
        if: steps.detect.outputs.hit == 'true'
        shell: powershell
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_URL: ${{ steps.detect.outputs.issue_url }}
          COMMENT: ${{ steps.detect.outputs.comment_body }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== CLINE START ==='
          Write-Host "Issue: $env:ISSUE_URL"
          Write-Host "Task: $env:COMMENT"
          Write-Host 'Cline will work in the checked-out Unity repository.'

          $prompt = @"
You are operating on the CompanyGame Unity project in this checked-out repository.
The user issued this GitHub request:

$env:COMMENT

Perform the requested task directly in the project. Use Act mode and make the actual changes.
Do not merely explain what to do. Inspect the project as needed, perform the work, and verify the result before finishing.
"@

          cline --yolo --json --provider openrouter --key $env:OPENROUTER_API_KEY --cwd $env:GITHUB_WORKSPACE $prompt
          if ($LASTEXITCODE -ne 0) { throw "Cline exited with code $LASTEXITCODE" }

      - name: Publish Cline changes
        if: steps.detect.outputs.hit == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'Cline Agent'
          git config user.email 'cline-agent@users.noreply.github.com'
          git status --short
          git add -A
          if (git diff --cached --quiet) {
            Write-Host 'No repository changes to commit.'
            exit 0
          }
          git commit -m 'Cline: execute issue task'
          git push origin HEAD:main

      - name: Post response to Issue
        if: steps.detect.outputs.hit == 'true'
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ steps.detect.outputs.issue_number }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: "Cline finished the requested task on the self-hosted Windows runner. Check the Actions run and the latest commit for the result."
            });
