name: Cline Issue Assistant

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write

jobs:
  respond:
    runs-on: ubuntu-latest
    environment: cline-actions
    steps:
      - name: Check for @cline mention
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment?.body || "";
            const isPR = !!context.payload.issue?.pull_request;
            const hit = body.toLowerCase().includes("@cline");
            core.setOutput("hit", (!isPR && hit) ? "true" : "false");
            core.setOutput("issue_number", String(context.payload.issue?.number || ""));
            core.setOutput("issue_url", context.payload.issue?.html_url || "");
            core.setOutput("comment_body", body);

      - name: Checkout repository
        if: steps.detect.outputs.hit == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.detect.outputs.hit == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Cline CLI
        if: steps.detect.outputs.hit == 'true'
        run: npm install -g cline

      - name: Configure Cline Authentication
        if: steps.detect.outputs.hit == 'true'
        run: cline auth --provider openrouter --apikey "${{ secrets.OPENROUTER_API_KEY }}"

      - name: Run Cline
        if: steps.detect.outputs.hit == 'true'
        env:
          ISSUE_URL: ${{ steps.detect.outputs.issue_url }}
          COMMENT: ${{ steps.detect.outputs.comment_body }}
        run: |
          set -euo pipefail
          echo "=== CLINE START ==="
          echo "Issue: ${ISSUE_URL}"
          echo "Request: ${COMMENT}"
          echo "=== CLINE EXECUTION ==="
          cline --yolo --json "Work directly on the repository for this GitHub issue. Execute the user's request, make the actual code/project changes, and verify the result. User request: ${COMMENT} Issue: ${ISSUE_URL}"

      - name: Commit Cline changes
        if: steps.detect.outputs.hit == 'true'
        run: |
          git config user.name 'Cline Agent'
          git config user.email 'cline-agent@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repository changes.'
            exit 0
          fi
          git commit -m 'Cline: execute issue task'
          git push origin HEAD:main

      - name: Post response
        if: steps.detect.outputs.hit == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.detect.outputs.issue_number }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: "Cline finished the requested task. Check this Actions run for the live execution log and the latest commit for the changes."
            });
